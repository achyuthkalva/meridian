<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Meridian interaction model</title>
  <desc id="desc">Seven controls establish a working contract, eleven modes serve different user intents, and five cadences make user involvement predictable.</desc>
  <defs>
    <linearGradient id="bg" x1="55" y1="30" x2="1140" y2="690" gradientUnits="userSpaceOnUse"><stop stop-color="#102B3D"/><stop offset="0.6" stop-color="#091A27"/><stop offset="1" stop-color="#060F18"/></linearGradient>
    <linearGradient id="ring" x1="300" y1="170" x2="900" y2="590" gradientUnits="userSpaceOnUse"><stop stop-color="#F3C56B"/><stop offset="0.45" stop-color="#8BE6D7"/><stop offset="1" stop-color="#6798F0"/></linearGradient>
    <style>.sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.caps{letter-spacing:2.2px}.mode{font-size:13px;font-weight:620}.group{font-size:12px;font-weight:700;letter-spacing:1.8px}</style>
  </defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <g class="sans">
    <text x="60" y="65" fill="#8BE6D7" font-size="13" font-weight="700" class="caps">THE INTERACTION MODEL</text>
    <text x="60" y="111" fill="#F4F8FA" font-size="32" font-weight="650" letter-spacing="-0.8">Meridian begins wherever the real work begins.</text>
    <text x="60" y="140" fill="#8EA3B3" font-size="16">Input format does not choose the workflow. The user’s intent, evidence, and decision do.</text>

    <ellipse cx="600" cy="406" rx="454" ry="190" fill="none" stroke="#274A5E" stroke-width="1.3" stroke-dasharray="5 8"/>
    <circle cx="600" cy="406" r="108" fill="#0D2938" stroke="url(#ring)" stroke-width="1.6"/>
    <circle cx="600" cy="406" r="85" fill="#0A202E" stroke="#294B5E"/>
    <text x="600" y="370" text-anchor="middle" fill="#8BE6D7" class="group">WORKING CONTRACT</text>
    <text x="600" y="402" text-anchor="middle" fill="#F3F7F9" font-size="25" font-weight="650">7 controls</text>
    <text x="600" y="430" text-anchor="middle" fill="#8EA3B3" font-size="12">intent · scope · time · actors</text>
    <text x="600" y="449" text-anchor="middle" fill="#8EA3B3" font-size="12">evidence · cadence · output</text>

    <g>
      <text x="122" y="210" fill="#F3C56B" class="group">LOCATE</text>
      <rect x="120" y="226" width="205" height="43" rx="13" fill="#132A33" stroke="#61593E"/><text x="140" y="253" fill="#DDE9EF" class="mode">Orient and locate</text>
      <rect x="120" y="279" width="205" height="43" rx="13" fill="#132A33" stroke="#61593E"/><text x="140" y="306" fill="#DDE9EF" class="mode">Intake and normalize</text>

      <text x="875" y="210" fill="#8BE6D7" class="group">DEVELOP</text>
      <rect x="875" y="226" width="205" height="43" rx="13" fill="#102D35" stroke="#346B61"/><text x="895" y="253" fill="#DDE9EF" class="mode">Construct</text>
      <rect x="875" y="279" width="205" height="43" rx="13" fill="#102D35" stroke="#346B61"/><text x="895" y="306" fill="#DDE9EF" class="mode">Reconstruct</text>
      <rect x="875" y="332" width="205" height="43" rx="13" fill="#102D35" stroke="#346B61"/><text x="895" y="359" fill="#DDE9EF" class="mode">Research and contextualize</text>

      <text x="122" y="401" fill="#69C7C9" class="group">CHALLENGE</text>
      <rect x="120" y="417" width="205" height="43" rx="13" fill="#102A35" stroke="#2F6268"/><text x="140" y="444" fill="#DDE9EF" class="mode">Audit and repair</text>
      <rect x="120" y="470" width="205" height="43" rx="13" fill="#102A35" stroke="#2F6268"/><text x="140" y="497" fill="#DDE9EF" class="mode">Reconcile and update</text>
      <rect x="120" y="523" width="205" height="43" rx="13" fill="#102A35" stroke="#2F6268"/><text x="140" y="550" fill="#DDE9EF" class="mode">Compare and decide</text>
      <rect x="120" y="576" width="205" height="43" rx="13" fill="#102A35" stroke="#2F6268"/><text x="140" y="603" fill="#DDE9EF" class="mode">Evaluate and learn</text>

      <text x="875" y="447" fill="#79A7F5" class="group">ALIGN AND EXPRESS</text>
      <rect x="875" y="463" width="205" height="43" rx="13" fill="#102638" stroke="#335E80"/><text x="895" y="490" fill="#DDE9EF" class="mode">Facilitate and align</text>
      <rect x="875" y="516" width="205" height="43" rx="13" fill="#102638" stroke="#335E80"/><text x="895" y="543" fill="#DDE9EF" class="mode">Translate and communicate</text>
    </g>

    <g fill="none" stroke="#315366" stroke-width="1.2">
      <path d="M325 301C420 302 436 343 493 378"/><path d="M875 302C788 302 772 344 707 378"/>
      <path d="M325 518C416 512 447 476 500 442"/><path d="M875 511C790 505 759 470 700 438"/>
    </g>

    <g transform="translate(375 646)">
      <text x="-255" y="19" fill="#8EA3B3" font-size="12" font-weight="700" class="caps">CADENCE</text>
      <g fill="#0D2635" stroke="#294F63">
        <rect width="84" height="34" rx="17"/><rect x="94" width="94" height="34" rx="17"/><rect x="198" width="98" height="34" rx="17"/><rect x="306" width="104" height="34" rx="17"/><rect x="420" width="100" height="34" rx="17"/>
      </g>
      <g fill="#B8CAD4" font-size="12" font-weight="620" text-anchor="middle">
        <text x="42" y="22">Guided</text><text x="141" y="22">Controlled</text><text x="247" y="22">Continuous</text><text x="358" y="22">Rapid triage</text><text x="470" y="22">Review-only</text>
      </g>
    </g>
    <text x="1140" y="704" text-anchor="end" fill="#8EA3B3" font-size="12">Modes can combine. The sixteen levels remain fixed.</text>
  </g>
</svg>
