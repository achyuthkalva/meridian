<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Human judgment gates in Meridian</title>
  <desc id="desc">The agent proceeds independently through reversible evidence work, while people decide matters that change truth, strategic commitment, ownership, publication, or release.</desc>
  <defs>
    <linearGradient id="bg" x1="55" y1="30" x2="1150" y2="655" gradientUnits="userSpaceOnUse"><stop stop-color="#102B3D"/><stop offset="0.6" stop-color="#091A27"/><stop offset="1" stop-color="#060F18"/></linearGradient>
    <linearGradient id="gate" x1="600" y1="176" x2="600" y2="615" gradientUnits="userSpaceOnUse"><stop stop-color="#F3C56B"/><stop offset="0.42" stop-color="#8BE6D7"/><stop offset="1" stop-color="#6798F0"/></linearGradient>
    <style>.sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.caps{letter-spacing:2.2px}.item{font-size:13px;font-weight:620}</style>
  </defs>
  <rect width="1200" height="690" rx="28" fill="url(#bg)"/>
  <g class="sans">
    <text x="60" y="65" fill="#8BE6D7" font-size="13" font-weight="700" class="caps">HUMAN JUDGMENT</text>
    <text x="60" y="111" fill="#F4F8FA" font-size="32" font-weight="650" letter-spacing="-0.8">Automation does the legwork. People keep decision authority.</text>
    <text x="60" y="140" fill="#8EA3B3" font-size="16">Meridian pauses only when the next step would change truth, commitment, privacy, or release.</text>

    <rect x="60" y="176" width="480" height="444" rx="22" fill="#0B2130" stroke="#2E5265"/>
    <rect x="660" y="176" width="480" height="444" rx="22" fill="#0B2130" stroke="#4A5D62"/>
    <text x="90" y="214" fill="#8BE6D7" font-size="12" font-weight="700" class="caps">AGENT PROCEEDS</text>
    <text x="690" y="214" fill="#F3C56B" font-size="12" font-weight="700" class="caps">HUMAN DECIDES</text>
    <text x="90" y="243" fill="#DDE9EF" font-size="19" font-weight="620">Reversible evidence work</text>
    <text x="690" y="243" fill="#DDE9EF" font-size="19" font-weight="620">Consequential judgment</text>

    <g class="item" fill="#B6C8D2">
      <g transform="translate(90 278)"><circle cx="8" cy="-4" r="4" fill="#8BE6D7"/><text x="26">Inventory and normalize sources</text></g>
      <g transform="translate(90 318)"><circle cx="8" cy="-4" r="4" fill="#8BE6D7"/><text x="26">Extract and classify candidate claims</text></g>
      <g transform="translate(90 358)"><circle cx="8" cy="-4" r="4" fill="#8BE6D7"/><text x="26">Map gaps, conflicts, and boundaries</text></g>
      <g transform="translate(90 398)"><circle cx="8" cy="-4" r="4" fill="#8BE6D7"/><text x="26">Draft qualified alternatives</text></g>
      <g transform="translate(90 438)"><circle cx="8" cy="-4" r="4" fill="#8BE6D7"/><text x="26">Trace claims up and down the chain</text></g>
      <g transform="translate(90 478)"><circle cx="8" cy="-4" r="4" fill="#8BE6D7"/><text x="26">Research authorized context</text></g>
      <g transform="translate(90 518)"><circle cx="8" cy="-4" r="4" fill="#8BE6D7"/><text x="26">Run evidence and quality audits</text></g>
      <g transform="translate(90 558)"><circle cx="8" cy="-4" r="4" fill="#8BE6D7"/><text x="26">Continue within an approved module</text></g>
    </g>
    <rect x="90" y="579" width="420" height="24" rx="12" fill="#10372F" stroke="#337262"/>
    <text x="300" y="595" text-anchor="middle" fill="#BDEDE3" font-size="11" font-weight="650">No routine approval is needed between reversible steps.</text>

    <g class="item">
      <g fill="#122A34" stroke="#5B573F">
        <rect x="690" y="275" width="132" height="62" rx="14"/><rect x="834" y="275" width="132" height="62" rx="14"/><rect x="978" y="275" width="132" height="62" rx="14"/>
        <rect x="690" y="350" width="132" height="62" rx="14"/><rect x="834" y="350" width="132" height="62" rx="14"/><rect x="978" y="350" width="132" height="62" rx="14"/>
        <rect x="690" y="425" width="132" height="62" rx="14"/><rect x="834" y="425" width="132" height="62" rx="14"/><rect x="978" y="425" width="132" height="62" rx="14"/>
      </g>
      <g fill="#D5DEE3" text-anchor="middle" font-size="12">
        <text x="756" y="301"><tspan x="756">Actor and</tspan><tspan x="756" dy="18">scope</tspan></text>
        <text x="900" y="301"><tspan x="900">Historical</tspan><tspan x="900" dy="18">truth</tspan></text>
        <text x="1044" y="311">Ownership</text>
        <text x="756" y="376"><tspan x="756">Strategic</tspan><tspan x="756" dy="18">commitment</tspan></text>
        <text x="900" y="376"><tspan x="900">Evidence</tspan><tspan x="900" dy="18">conflict</tspan></text>
        <text x="1044" y="376"><tspan x="1044">Concept</tspan><tspan x="1044" dy="18">commitment</tspan></text>
        <text x="756" y="451"><tspan x="756">Outcome</tspan><tspan x="756" dy="18">claim</tspan></text>
        <text x="900" y="451"><tspan x="900">Publication</tspan><tspan x="900" dy="18">and privacy</tspan></text>
        <text x="1044" y="451"><tspan x="1044">Approval</tspan><tspan x="1044" dy="18">and lock</tspan></text>
      </g>
    </g>
    <path d="M600 184V611" stroke="url(#gate)" stroke-width="3" stroke-linecap="round"/>
    <g fill="#07141D" stroke-width="2"><circle cx="600" cy="241" r="8" stroke="#F3C56B"/><circle cx="600" cy="358" r="8" stroke="#8BE6D7"/><circle cx="600" cy="475" r="8" stroke="#69C7C9"/><circle cx="600" cy="592" r="8" stroke="#6798F0"/></g>
    <g fill="none" stroke="#3A596A"><path d="M540 241H592"/><path d="M608 241H660"/><path d="M540 358H592"/><path d="M608 358H660"/><path d="M540 475H592"/><path d="M608 475H660"/><path d="M540 592H592"/><path d="M608 592H660"/></g>
    <text x="600" y="651" text-anchor="middle" fill="#8499A7" font-size="13">A recorded human decision overrides automated preference.</text>
  </g>
</svg>
